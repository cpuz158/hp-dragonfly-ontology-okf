* { box-sizing: border-box; }
body {
  margin: 0;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
  font-size: 14px;
  color: #0f172a;
  background: #f8fafc;
  display: flex;
  flex-direction: column;
  height: 100vh;
}
header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 10px 16px;
  background: #fff;
  border-bottom: 1px solid #e2e8f0;
  flex-shrink: 0;
}
.title strong { font-size: 16px; margin-right: 8px; }
.muted { color: #64748b; font-size: 12px; }
.controls { display: flex; gap: 8px; }
.controls input, .controls select, .controls button {
  font-size: 13px;
  padding: 5px 8px;
  border: 1px solid #cbd5e1;
  border-radius: 4px;
  background: #fff;
}
.controls input { width: 220px; }
.controls button { cursor: pointer; background: #f1f5f9; }
.controls button:hover { background: #e2e8f0; }

main {
  display: flex;
  flex: 1;
  min-height: 0;
}
#graph {
  flex: 1 1 60%;
  background: #fff;
  border-right: 1px solid #e2e8f0;
  min-width: 0;
  position: relative;
}
#detail {
  flex: 0 0 40%;
  overflow-y: auto;
  padding: 18px 22px;
  background: #fff;
}
#detail-empty {
  text-align: center;
  margin-top: 40px;
}

.detail-header { margin-bottom: 12px; }
.detail-header h1 {
  font-size: 18px;
  margin: 4px 0 2px;
  font-weight: 600;
}
.type-chip {
  display: inline-block;
  padding: 2px 8px;
  border-radius: 10px;
  font-size: 11px;
  font-weight: 600;
  color: #fff;
  background: #94a3b8;
  text-transform: uppercase;
  letter-spacing: 0.5px;
}
dl.frontmatter {
  display: grid;
  grid-template-columns: 90px 1fr;
  row-gap: 4px;
  column-gap: 12px;
  margin: 8px 0 12px;
  font-size: 13px;
}
dl.frontmatter dt {
  color: #64748b;
  font-weight: 500;
}
dl.frontmatter dd { margin: 0; }
dl.frontmatter a { color: #2563eb; word-break: break-all; }

.tag {
  display: inline-block;
  padding: 1px 6px;
  margin: 0 4px 2px 0;
  border-radius: 4px;
  background: #f1f5f9;
  color: #475569;
  font-size: 11px;
}

.badges {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin: 8px 0 4px;
}
.badge {
  display: inline-block;
  padding: 2px 8px;
  border-radius: 10px;
  font-size: 11px;
  font-weight: 600;
  border: 1px solid transparent;
}
.badge.status-stable { background: #ecfdf5; color: #047857; border-color: #a7f3d0; }
.badge.status-draft { background: #fefce8; color: #a16207; border-color: #fde68a; }
.badge.status-deprecated { background: #f1f5f9; color: #64748b; border-color: #cbd5e1; text-decoration: line-through; }
.badge.trust-unverified { background: #f1f5f9; color: #64748b; border-color: #cbd5e1; }
.badge.trust-machine-confirmed { background: #eff6ff; color: #1d4ed8; border-color: #bfdbfe; }
.badge.trust-human-reviewed { background: #f5f3ff; color: #6d28d9; border-color: #ddd6fe; }
.badge.stale { background: #fef2f2; color: #b91c1c; border-color: #fecaca; }
.badge.fresh { background: #ecfdf5; color: #047857; border-color: #a7f3d0; }

.sources-list { padding-left: 18px; margin: 0; }
.sources-list li { margin: 1px 0; }

hr { border: none; border-top: 1px solid #e2e8f0; margin: 14px 0; }

#detail-body { font-size: 13px; line-height: 1.55; }
#detail-body h1 {
  font-size: 16px; margin: 18px 0 6px;
  padding-bottom: 4px; border-bottom: 1px solid #e2e8f0;
}
#detail-body h2 { font-size: 14px; margin: 14px 0 4px; }
#detail-body h3 { font-size: 13px; margin: 12px 0 4px; }
#detail-body p { margin: 6px 0; }
#detail-body code {
  background: #f1f5f9;
  padding: 1px 4px;
  border-radius: 3px;
  font-size: 12px;
  font-family: ui-monospace, "SF Mono", Consolas, monospace;
}
#detail-body pre {
  background: #0f172a;
  color: #e2e8f0;
  padding: 10px 12px;
  border-radius: 6px;
  overflow-x: auto;
  font-size: 12px;
}
#detail-body pre code { background: transparent; color: inherit; padding: 0; }
#detail-body ul, #detail-body ol { padding-left: 22px; margin: 6px 0; }
#detail-body li { margin: 2px 0; }
#detail-body table { border-collapse: collapse; margin: 8px 0; }
#detail-body th, #detail-body td {
  border: 1px solid #e2e8f0; padding: 4px 8px; font-size: 12px;
}
#detail-body a.internal { color: #2563eb; cursor: pointer; }
#detail-body a.external { color: #2563eb; }

#detail-backlinks { margin-top: 18px; }
#detail-backlinks h2 { font-size: 13px; color: #64748b; margin-bottom: 6px; }
#detail-backlinks ul { padding-left: 18px; }
#detail-backlinks a { color: #2563eb; cursor: pointer; }

</style>
</head>
<body>
<header>
  <div class="title">
    <strong id="bundle-name"></strong>
    <span class="muted">OKF bundle</span>
  </div>
  <div class="controls">
    <input id="search" type="search" placeholder="Search title / id / tag">
    <select id="filter-type">
      <option value="">All types</option>
    </select>
    <select id="layout">
      <option value="cose">cose (force)</option>
      <option value="concentric">concentric</option>
      <option value="breadthfirst">breadth-first</option>
      <option value="circle">circle</option>
      <option value="grid">grid</option>
    </select>
    <button id="reset">Reset view</button>
  </div>
</header>

<main>
  <section id="graph"></section>
  <section id="detail">
    <div id="detail-empty" class="muted">Click a node to see its details.</div>
    <article id="detail-content" hidden>
      <header class="detail-header">
        <span class="type-chip" id="detail-type"></span>
        <h1 id="detail-title"></h1>
        <div class="muted" id="detail-id"></div>
      </header>
      <div class="badges" id="detail-badges"></div>
      <dl class="frontmatter">
        <dt>Description</dt><dd id="detail-description"></dd>
        <dt>Resource</dt><dd id="detail-resource"></dd>
        <dt>Tags</dt><dd id="detail-tags"></dd>
        <dt>Generated</dt><dd id="detail-generated"></dd>
        <dt>Verified</dt><dd id="detail-verified"></dd>
        <dt>Sources</dt><dd id="detail-sources"></dd>
      </dl>
      <hr>
      <div id="detail-body"></div>
      <section id="detail-backlinks" hidden>
        <h2>Cited by</h2>
        <ul id="backlinks-list"></ul>
      </section>
    </article>
  </section>
</main>

44", "source": "tables/dragonfly_series_models", "target": "references/hp-folio-g3-service-manual-n17344"}}, {"data": {"id": "tables/dragonfly_series_models__references/thunderbolt-4-port-and-dock-architecture", "source": "tables/dragonfly_series_models", "target": "references/thunderbolt-4-port-and-dock-architecture"}}, {"data": {"id": "tables/firmware_bios_and_nvm__tables/dragonfly_series_models", "source": "tables/firmware_bios_and_nvm", "target": "tables/dragonfly_series_models"}}, {"data": {"id": "tables/firmware_bios_and_nvm__tables/community_troubleshooting_cases", "source": "tables/firmware_bios_and_nvm", "target": "tables/community_troubleshooting_cases"}}, {"data": {"id": "tables/firmware_bios_and_nvm__references/bios-nvm-and-hp-sure-start-security", "source": "tables/firmware_bios_and_nvm", "target": "references/bios-nvm-and-hp-sure-start-security"}}, {"data": {"id": "tables/hardware_components_catalog__tables/component_disassembly_deps", "source": "tables/hardware_components_catalog", "target": "tables/component_disassembly_deps"}}, {"data": {"id": "tables/hardware_components_catalog__tables/product_skus_and_configs", "source": "tables/hardware_components_catalog", "target": "tables/product_skus_and_configs"}}, {"data": {"id": "tables/hardware_components_catalog__tables/community_troubleshooting_cases", "source": "tables/hardware_components_catalog", "target": "tables/community_troubleshooting_cases"}}, {"data": {"id": "tables/hardware_components_catalog__references/hp-folio-g3-service-manual-n17344", "source": "tables/hardware_components_catalog", "target": "references/hp-folio-g3-service-manual-n17344"}}, {"data": {"id": "tables/hardware_components_catalog__references/disassembly-prerequisite-graph-and-esd", "source": "tables/hardware_components_catalog", "target": "references/disassembly-prerequisite-graph-and-esd"}}, {"data": {"id": "tables/ports_sensors_and_docks__tables/dragonfly_series_models", "source": "tables/ports_sensors_and_docks", "target": "tables/dragonfly_series_models"}}, {"data": {"id": "tables/ports_sensors_and_docks__tables/firmware_bios_and_nvm", "source": "tables/ports_sensors_and_docks", "target": "tables/firmware_bios_and_nvm"}}, {"data": {"id": "tables/ports_sensors_and_docks__tables/community_troubleshooting_cases", "source": "tables/ports_sensors_and_docks", "target": "tables/community_troubleshooting_cases"}}, {"data": {"id": "tables/ports_sensors_and_docks__references/thunderbolt-4-port-and-dock-architecture", "source": "tables/ports_sensors_and_docks", "target": "references/thunderbolt-4-port-and-dock-architecture"}}, {"data": {"id": "tables/product_skus_and_configs__tables/hardware_components_catalog", "source": "tables/product_skus_and_configs", "target": "tables/hardware_components_catalog"}}, {"data": {"id": "tables/product_skus_and_configs__tables/dragonfly_series_models", "source": "tables/product_skus_and_configs", "target": "tables/dragonfly_series_models"}}, {"data": {"id": "tables/product_skus_and_configs__tables/community_troubleshooting_cases", "source": "tables/product_skus_and_configs", "target": "tables/community_troubleshooting_cases"}}, {"data": {"id": "tables/product_skus_and_configs__references/hp-folio-g3-service-manual-n17344", "source": "tables/product_skus_and_configs", "target": "references/hp-folio-g3-service-manual-n17344"}}, {"data": {"id": "tables/product_skus_and_configs__references/bios-nvm-and-hp-sure-start-security", "source": "tables/product_skus_and_configs", "target": "references/bios-nvm-and-hp-sure-start-security"}}], "bodies": {"computations/fru-replacement-rate-by-category": "# Computation\n\n```sql\nSELECT\n  t.issue_category,\n  COUNT(t.case_id) AS distinct_cases,\n  SUM(t.occurrence_count) AS total_reported_incidents,\n  SUM(IF(t.requires_part_replacement, t.occurrence_count, 0)) AS fru_replacement_incidents,\n  ROUND(\n    SAFE_DIVIDE(\n      SUM(IF(t.requires_part_replacement, t.occurrence_count, 0)),\n      SUM(t.occurrence_count)\n    ) * 100,\n    1\n  ) AS fru_replacement_rate_pct,\n  ROUND(\n    SAFE_DIVIDE(\n      SUM(t.avg_resolution_time_min * t.occurrence_count),\n      SUM(t.occurrence_count)\n    ),\n    1\n  ) AS weighted_avg_resolution_min\nFROM `hp-dragonfly.prj_ontology_hp_dragonfly.community_troubleshooting_cases` AS t\nGROUP BY t.issue_category\nORDER BY total_reported_incidents DESC;\n```\n\nImplements [`metrics/hardware-fru-replacement-rate.md`](../metrics/hardware-fru-replacement-rate.md) over [`tables/community_troubleshooting_cases.md`](../tables/community_troubleshooting_cases.md)[^ts-cases][^fru-metric].\n\n[^ts-cases]: Community Troubleshooting Cases Table\n[^fru-metric]: Hardware FRU Replacement Rate Metric", "computations/multi-hop-disassembly-critical-path": "# Computation\n\n```sql\nGRAPH `hp-dragonfly.prj_ontology_hp_dragonfly.hp_dragonfly_ontology_graph`\nMATCH (t:TroubleshootingCase)-[:AFFECTS_COMPONENT]->(c:HardwareComponent)-[r:REQUIRES_REMOVAL_OF]->(prereq:HardwareComponent)\nRETURN\n  t.case_id,\n  t.issue_category,\n  c.part_number AS target_part_number,\n  c.component_name AS target_component,\n  r.step_order,\n  prereq.part_number AS prerequisite_part_number,\n  prereq.component_name AS prerequisite_component,\n  r.fastener_screw_spec,\n  r.required_tools,\n  r.caution_note\nORDER BY t.case_id, r.step_order;\n```\n\nTraverses the `hp_dragonfly_ontology_graph` Property Graph across [`tables/community_troubleshooting_cases.md`](../tables/community_troubleshooting_cases.md), [`tables/hardware_components_catalog.md`](../tables/hardware_components_catalog.md), and [`tables/component_disassembly_deps.md`](../tables/component_disassembly_deps.md) to output the exact disassembly checklist for [`metrics/component-service-complexity-score.md`](../metrics/component-service-complexity-score.md)[^deps-table][^complexity-metric].\n\n[^deps-table]: Component Disassembly Dependencies Table\n[^complexity-metric]: Component Service Complexity Score", "datasets/prj_ontology_hp_dragonfly": "# Overview\n\nThe `hp-dragonfly.prj_ontology_hp_dragonfly` dataset (friendly name: `prj-ontology-hp-dragonfly`) is the structured backbone of the **HP Dragonfly Ontology Layer** on Google Cloud[^bq-ds]. It integrates product architecture, regional SKUs, official spare part catalogs, physical disassembly prerequisite edges, Thunderbolt 4 port/dock specifications, BIOS/NVM security chips, POST LED blink codes, and community troubleshooting cases grounded in the *HP Dragonfly Folio 13.5 inch G3 2-in-1 Notebook PC Maintenance and Service Guide* (`N17344-001`)[^hp-msg-n17344].\n\nIt also hosts the native BigQuery Property Graph **`hp-dragonfly.prj_ontology_hp_dragonfly.hp_dragonfly_ontology_graph`**, enabling multi-hop GQL graph traversal across [`computations/multi-hop-disassembly-critical-path`](../computations/multi-hop-disassembly-critical-path.md).\n\n# Schema (Tables in Dataset)\n\n- [`tables/community_troubleshooting_cases`](../tables/community_troubleshooting_cases.md) (12 rows): Real-world hardware, firmware, and OS troubleshooting cases collected from HP Support Community, Reddit, and enterprise field escalations (Node Table: TroubleshootingCase)\n- [`tables/component_disassembly_deps`](../tables/component_disassembly_deps.md) (15 rows): Physical disassembly prerequisite edges defining which component must be removed before another component (Edge Table: REQUIRES_REMOVAL_OF)\n- [`tables/diagnostic_codes_reference`](../tables/diagnostic_codes_reference.md) (8 rows): HP PC Hardware Diagnostics UEFI/Windows failure codes, power/battery LED blink patterns, and ESD/thermal thresholds (Node Table: DiagnosticCode)\n- [`tables/dragonfly_series_models`](../tables/dragonfly_series_models.md) (6 rows): Master lineup and physical specifications for the HP Dragonfly product family (G1, G2, Max, G3, Folio G3, G4) (Node Table: ProductModel)\n- [`tables/edge_case_governed_by_playbook`](../tables/edge_case_governed_by_playbook.md) (12 rows): Cross-Layer ONT-to-LEX Bridge Edge Table: TroubleshootingCase -> ServicePlaybook (GOVERNED_BY_PLAYBOOK).\n- [`tables/edge_component_documented_in_chapter`](../tables/edge_component_documented_in_chapter.md) (38 rows): Cross-Layer ONT-to-LEX Bridge Edge Table: HardwareComponent -> ServiceManualChapter (DOCUMENTED_IN_CHAPTER).\n- [`tables/edge_diagnostic_defined_in_chapter`](../tables/edge_diagnostic_defined_in_chapter.md) (8 rows): Cross-Layer ONT-to-LEX Bridge Edge Table: DiagnosticCode -> ServiceManualChapter (DEFINED_IN_CH6_MANUAL).\n- [`tables/edge_playbook_orchestrates_chapter`](../tables/edge_playbook_orchestrates_chapter.md) (8 rows): LEX Layer Edge Table: ServicePlaybook -> ServiceManualChapter (ORCHESTRATES_REFERENCE).\n- [`tables/firmware_bios_and_nvm`](../tables/firmware_bios_and_nvm.md) (8 rows): System BIOS releases, SoftPaq driver packages, and Nonvolatile Memory (NVM) / TPM 2.0 security specifications\n- [`tables/hardware_components_catalog`](../tables/hardware_components_catalog.md) (38 rows): Official spare parts catalog for HP Dragonfly G3 and Folio G3 including major components, display subcomponents, and kits (Node Table: HardwareComponent)\n- [`tables/lex_manual_chapters`](../tables/lex_manual_chapters.md) (5 rows): Unstructured LEX Node Table: 5 OKF v0.2 reference chapters extracted from N17344-001 with Dataplex kc_entry_id.\n- [`tables/lex_service_manual_documents`](../tables/lex_service_manual_documents.md) (2 rows): Unstructured LEX Node Table: Origin HP Service Guide PDF roots linked to Dataplex Knowledge Catalog (okf_hp_dragonfly).\n- [`tables/lex_service_playbooks`](../tables/lex_service_playbooks.md) (6 rows): Unstructured LEX Node Table: 6 OKF v0.2 agent playbooks, computations, and metrics with Dataplex kc_entry_id.\n- [`tables/ports_sensors_and_docks`](../tables/ports_sensors_and_docks.md) (10 rows): External I/O ports, internal sensors, status LEDs, active pen, and official HP docking station compatibility matrix\n- [`tables/product_skus_and_configs`](../tables/product_skus_and_configs.md) (12 rows): Commercial SKU configurations and hardware specifications for HP Elite Dragonfly G3, Dragonfly Folio G3, and series models (Node Table: ProductSKU)\n\n# Grounded Knowledge References\n\n- [`references/hp-folio-g3-service-manual-n17344`](../references/hp-folio-g3-service-manual-n17344.md)\n- [`references/disassembly-prerequisite-graph-and-esd`](../references/disassembly-prerequisite-graph-and-esd.md)\n- [`references/post-led-blink-and-uefi-diagnostics`](../references/post-led-blink-and-uefi-diagnostics.md)\n- [`references/bios-nvm-and-hp-sure-start-security`](../references/bios-nvm-and-hp-sure-start-security.md)\n- [`references/thunderbolt-4-port-and-dock-architecture`](../references/thunderbolt-4-port-and-dock-architecture.md)\n\n[^bq-ds]: BigQuery Dataset `hp-dragonfly.prj_ontology_hp_dragonfly`\n[^hp-msg-n17344]: HP Dragonfly Folio 13.5 inch G3 Maintenance and Service Guide (N17344-001)", "log": "# Bundle History\n\n## 2026-10-25\n\n- **Verified** the full HP Dragonfly Ontology bundle for OKF v0.2 conformance (`human:dhmoon@google.com`). All 8 BigQuery tables, 5 Service Manual Reference concepts (`N17344-001`), 2 Metrics, 2 Attested Computations, and 2 Service Playbooks validated in 100% English.\n- **Enriched** from unstructured PDF `docs/pdf_6290467_en-US-1.pdf` (*HP Dragonfly Folio 13.5 inch G3 2-in-1 Notebook PC Maintenance and Service Guide*, 109 pages) and structured BigQuery dataset `hp-dragonfly.prj_ontology_hp_dragonfly` (109 rows + Property Graph `hp_dragonfly_ontology_graph`) by `enrichment_agent/gemini-3.8-flash`.", "metrics/component-service-complexity-score": "# Definition\n\nThe **Component Service Complexity Score** counts the number of prerequisite removal steps (`COUNT(dependency_id)`) in [component_disassembly_deps](../tables/component_disassembly_deps.md) required to reach a target `part_number` in [hardware_components_catalog](../tables/hardware_components_catalog.md), paired with the average resolution time (`avg_resolution_time_min`) observed in [community_troubleshooting_cases](../tables/community_troubleshooting_cases.md)[^deps-table].\n\nThe sanctioned computation is [`computations/multi-hop-disassembly-critical-path.md`](../computations/multi-hop-disassembly-critical-path.md).\n\n[^deps-table]: BigQuery table `hp-dragonfly.prj_ontology_hp_dragonfly.component_disassembly_deps`", "metrics/hardware-fru-replacement-rate": "# Definition\n\nThe **Hardware FRU Replacement Rate** measures the share of weighted incident volume (`SUM(occurrence_count)`) in [community_troubleshooting_cases](../tables/community_troubleshooting_cases.md) where `requires_part_replacement = TRUE` versus total reported incidents in that `issue_category`[^ts-cases].\n\nThe sanctioned computation is [`computations/fru-replacement-rate-by-category.md`](../computations/fru-replacement-rate-by-category.md).\n\n# Operational Interpretation\n\n- **0% FRU Replacement Rate (Firmware/Driver Solvable):** Categories such as `BIOS & Boot`, `Thunderbolt & Docking`, and `Battery & Standby` are primarily resolved via SoftPaq updates (`sp148210`, `sp149503`) tracked in [firmware_bios_and_nvm](../tables/firmware_bios_and_nvm.md).\n- **High FRU Replacement Rate (Depot / Onsite Dispatch):** Categories involving soldered LPDDR5 memory (`LED-BLINK-3.2`), worn fan bearings (`N22936-001`), or pinched camera ZIF cables (`N23306-001`) require physical spare parts from [hardware_components_catalog](../tables/hardware_components_catalog.md) and prerequisite disassembly steps from [component_disassembly_deps](../tables/component_disassembly_deps.md).\n\n[^ts-cases]: BigQuery table `hp-dragonfly.prj_ontology_hp_dragonfly.community_troubleshooting_cases`", "playbooks/no-boot-bios-sure-start-recovery": "# Trigger Conditions\n\nInvoke this playbook when a user or ticket in [community_troubleshooting_cases](../tables/community_troubleshooting_cases.md) reports a black screen at power-on accompanied by Caps Lock LED blink patterns defined in [diagnostic_codes_reference](../tables/diagnostic_codes_reference.md)[^post-ref].\n\n# Step-by-Step Procedure\n\n1. **Identify Blink Code (`LED-BLINK-2.2` vs `LED-BLINK-3.2`):**\n   - **2 Long, 2 Short (`LED-BLINK-2.2` \u2014 Case `TS-DFG3-001`):** Main BIOS image in the 9 MB SPI flash is corrupted. Proceed to **Step 2 (Software/NVM Recovery)**.\n   - **3 Long, 2 Short (`LED-BLINK-3.2` \u2014 Case `TS-DFG3-010`):** Soldered LPDDR5-6400 memory training failure. Skip software recovery and proceed to **Step 3 (System Board Replacement)**.\n2. **Execute HP Sure Start Golden BIOS Recovery (`LED-BLINK-2.2`):**\n   - Disconnect all external docks ([ports_sensors_and_docks](../tables/ports_sensors_and_docks.md)) and connect the 65W USB-C AC adapter (`L04650-850`) directly to the left Thunderbolt 4 port.\n   - Hold the power button for 15 seconds to reset the Embedded Controller, then power on and wait up to 90 seconds for the isolated 8 MB **HP Sure Start** flash ([bios-nvm-and-hp-sure-start-security](../references/bios-nvm-and-hp-sure-start-security.md)) to re-flash the Golden BIOS image.\n   - Once booted, apply SoftPaq `sp148210` from [firmware_bios_and_nvm](../tables/firmware_bios_and_nvm.md).\n3. **Dispatch System Board FRU (`LED-BLINK-3.2`):**\n   - Look up the customer's `sku_id` in [product_skus_and_configs](../tables/product_skus_and_configs.md) to determine the exact `system_board_part_no` (`N20723-601`..`N20728-601`) in [hardware_components_catalog](../tables/hardware_components_catalog.md).\n   - Follow the 3-step prerequisite removal sequence in [component_disassembly_deps](../tables/component_disassembly_deps.md) (`N22918-001` Bottom Cover -> `M90788-005` Battery -> `N22936-001` Heat Sink) while observing the 700V ESD threshold ([disassembly-prerequisite-graph-and-esd](../references/disassembly-prerequisite-graph-and-esd.md)).\n\n[^post-ref]: POST LED Blink Codes Reference", "playbooks/oled-camera-and-cable-replacement": "# Trigger Conditions\n\nInvoke this playbook for case `TS-DFG3-005` in [community_troubleshooting_cases](../tables/community_troubleshooting_cases.md) when the HP 8MP + IR Camera (`N23306-001`) fails with Windows Camera error `0xA00F4244`[^disassembly-ref].\n\n# Step-by-Step Procedure\n\n1. **Verify Hardware Privacy Key State (No Disassembly):**\n   - Check the electronic camera privacy key LED on the top row of the keyboard (`N23845-001`). Unlike older generations with a physical slider, the Folio G3 privacy shutter is electronically actuated via the Display Hub Board (`N22937-001` / `N22938-001`).\n   - Update System BIOS (`sp148210`) in [firmware_bios_and_nvm](../tables/firmware_bios_and_nvm.md) and toggle the privacy key.\n2. **Physical Subcomponent Servicing (If USB Device Absent in Device Manager):**\n   - Per [component_disassembly_deps](../tables/component_disassembly_deps.md) (`DEP-010`, `DEP-011`, `DEP-012`), servicing `N23306-001` or the Display & Camera Cable Kit (`N22922-001`) requires releasing the display panel (`N23305-001` / `N23304-001`) in-place using non-marking suction cups and pulling the **8 stretch-release adhesive strips** at a shallow angle (Manual pp. 66\u201371).\n   - Always order Display & Foil Adhesive Kit `N22925-001` from [hardware_components_catalog](../tables/hardware_components_catalog.md) prior to opening the display bezel.\n\n[^disassembly-ref]: Disassembly Prerequisite Graph & ESD Reference", "references/bios-nvm-and-hp-sure-start-security": "# Non-Volatile Memory (NVM) Partition Architecture\n\nAppendix B (*Table B-1 Nonvolatile Memory Specifications*, pp. 87\u201389) defines four isolated non-volatile memory devices on the HP Dragonfly Folio G3 and Elite Dragonfly G3 system boards[^hp-msg-n17344]:\n\n1. **HP Sure Start Private SPI Flash (64 Mbit / 8 MB):** Stores the cryptographically signed Golden BIOS backup image and HP Sure Start controller firmware. Write-protected in hardware against host OS or SMM tampering.\n2. **System BIOS SPI Flash (72 Mbit / 9 MB):** Active UEFI System BIOS (`U95` family, SoftPaq `sp148210`) and user F10 configuration settings.\n3. **Intel Converged Security & Management Engine Flash (56 Mbit / 7 MB):** Intel CSE / vPro AMT firmware partition.\n4. **Discrete Trusted Platform Module (Infineon SLB9672 TPM 2.0):** FIPS 140-2 certified cryptographic co-processor storing BitLocker VMKs and Windows Hello keys. **Important:** Replacing the System Board clears TPM keys and requires the customer's 48-digit BitLocker Recovery Key upon first boot.\n\nLinked structured concepts:\n- [firmware_bios_and_nvm](../tables/firmware_bios_and_nvm.md)\n- [product_skus_and_configs](../tables/product_skus_and_configs.md)\n- [community_troubleshooting_cases](../tables/community_troubleshooting_cases.md)\n- [no-boot-bios-sure-start-recovery](../playbooks/no-boot-bios-sure-start-recovery.md)\n\n[^hp-msg-n17344]: HP Dragonfly Folio 13.5 inch G3 Maintenance and Service Guide, Appendix B (pp. 87\u201389)", "references/disassembly-prerequisite-graph-and-esd": "# Disassembly Dependency Hierarchy\n\nChapter 5 of the Maintenance and Service Guide enforces a strict removal dependency order modeled in [component_disassembly_deps](../tables/component_disassembly_deps.md) and queried via [computations/multi-hop-disassembly-critical-path](../computations/multi-hop-disassembly-critical-path.md)[^hp-msg-n17344]:\n\n1. **Bottom Cover (`N22918-001` / `N22919-001`):** Remove 2x Phillips M2.0x4.0 screws hidden beneath the rear rubber strip and loosen 5x captive Torx T5 screws (pp. 35\u201337).\n2. **Battery (`M90788-005`):** Disconnect the battery cable from the system board immediately after bottom cover removal to isolate electrical power before touching any internal FRU (pp. 44\u201345).\n3. **Heat Sink & Dual Fan Assembly (`N22936-001`):** Loosen 4x captive Phillips M2.0x4.0 screws on the CPU cold plate in reverse-numerical order and remove 2x Phillips M2.0x2.0 fan screws (pp. 59\u201360). Always clean and apply fresh thermal compound whenever the heat sink is lifted.\n4. **System Board (`N20723-601`..`N20728-601`):** Disconnect 10 ribbon/ZIF/coaxial cables, remove the USB-C port reinforcement bracket (`N22923-001`), and remove 6x Phillips M2.0x4.0 + 3x Phillips M1.6x2.5 screws (pp. 63\u201365).\n\n# Electrostatic Discharge (ESD) 700V Standard\n\nPer Chapter 8 (*Electrostatic Discharge*, pp. 85\u201386), Metal-Oxide Semiconductor (MOS) devices on the Alder Lake-U System Board can be permanently degraded by static discharges as low as **700 V (0.7 kV)**, whereas a human technician only feels static above ~3,000 V[^hp-msg-n17344]. Field technicians must ground the chassis, wear a conductive wrist strap, and keep replacement boards inside static-shielding bags until installation.\n\nLinked structured concepts:\n- [hardware_components_catalog](../tables/hardware_components_catalog.md)\n- [component_disassembly_deps](../tables/component_disassembly_deps.md)\n- [diagnostic_codes_reference](../tables/diagnostic_codes_reference.md)\n- [oled-camera-and-cable-replacement](../playbooks/oled-camera-and-cable-replacement.md)\n\n[^hp-msg-n17344]: HP Dragonfly Folio 13.5 inch G3 Maintenance and Service Guide, Chapters 5 & 8 (pp. 32\u201372, 85\u201386)", "references/hp-folio-g3-service-manual-n17344": "# Overview\n\nThis reference concept represents the unstructured PDF manual **`docs/pdf_6290467_en-US-1.pdf`** (*HP Dragonfly Folio 13.5 inch G3 2-in-1 Notebook PC Maintenance and Service Guide*, Document Part Number **`N17344-001`**, 109 pages)[^hp-msg-n17344]. The Enrichment Agent parses this manual and links its technical specifications to the 8 structured tables in [`datasets/prj_ontology_hp_dragonfly`](../datasets/prj_ontology_hp_dragonfly.md).\n\n# Chapter-to-Ontology Mapping\n\n| Manual Chapter | Pages | Summary of Extracted Knowledge | Linked OKF Concepts |\n| :--- | :---: | :--- | :--- |\n| **Chapter 1: Product Description** | pp. 1\u20134 | Alder Lake-U vPro/non-vPro processors, soldered LPDDR5-6400 memory (16/32 GB), 3:2 display options (WUXGA+ 400/1000-nit Sure View & 3K2K OLED), Gen4 NVMe SSDs | [dragonfly_series_models](../tables/dragonfly_series_models.md), [product_skus_and_configs](../tables/product_skus_and_configs.md) |\n| **Chapter 2: Components** | pp. 5\u201316 | Left/Right Thunderbolt 4 ports, 3.5mm audio cutoff jack, magnetic pen charging cradle, 8 MP + IR + ToF camera bezel, serial number label | [ports_sensors_and_docks](../tables/ports_sensors_and_docks.md), [thunderbolt-4-port-and-dock-architecture](thunderbolt-4-port-and-dock-architecture.md) |\n| **Chapter 3: Illustrated Parts Catalog** | pp. 17\u201328 | Exploded mechanical diagrams, system spare part numbers (`N20723-601`..`N20728-601`, `M90788-005`, `N22936-001`), display subcomponents | [hardware_components_catalog](../tables/hardware_components_catalog.md) |\n| **Chapter 5: Removal & Replacement** | pp. 32\u201372 | Prerequisite disassembly DAG, fastener screw torque/dimensions, thermal paste renewal rules, stretch-release adhesive strips | [component_disassembly_deps](../tables/component_disassembly_deps.md), [disassembly-prerequisite-graph-and-esd](disassembly-prerequisite-graph-and-esd.md) |\n| **Chapter 6 & Appendix B: Recovery & NVM** | pp. 73\u201376, 87\u201389 | System BIOS (`U95`), 8 MB isolated HP Sure Start Golden BIOS flash, 9 MB System BIOS, 7 MB Intel CSE/ME, Infineon TPM 2.0 | [firmware_bios_and_nvm](../tables/firmware_bios_and_nvm.md), [bios-nvm-and-hp-sure-start-security](bios-nvm-and-hp-sure-start-security.md) |\n| **Chapter 7 & 8: Diagnostics & ESD** | pp. 77\u201386 | Power/Battery LED states, Caps Lock blink codes (`2.2`, `3.2`, `5.2`), 24-digit UEFI Failure IDs, 700V MOS ESD threshold | [diagnostic_codes_reference](../tables/diagnostic_codes_reference.md), [post-led-blink-and-uefi-diagnostics](post-led-blink-and-uefi-diagnostics.md) |\n\n# Critical Engineering Constraints\n\n1. **Soldered LPDDR5 Memory:** Memory modules are permanently soldered onto the system board (p. 2, p. 32). Any memory hardware fault (`LED-BLINK-3.2`) requires replacing the entire System Board SKU mapped in [product_skus_and_configs](../tables/product_skus_and_configs.md)[^hp-msg-n17344].\n2. **Display Subcomponent Servicing:** Servicing the 8 MP + IR Camera (`N23306-001`) or Display Hub Board (`N22937-001`) does **not** require removing the display assembly from the chassis, but **does** require releasing 8 stretch-release adhesive strips behind the display panel and replacing them using Adhesive Kit `N22925-001` (pp. 66\u201371)[^hp-msg-n17344].\n\n[^hp-msg-n17344]: HP Dragonfly Folio 13.5 inch G3 Maintenance and Service Guide (Document Part Number N17344-001, August 2022)", "references/post-led-blink-and-uefi-diagnostics": "# POST LED Blink Code Matrix\n\nWhen the notebook fails to complete Power-On Self-Test (POST) prior to initializing video output, the Caps Lock LED flashes a two-part sequence (long flashes = major category, short flashes = minor subcode)[^hp-msg-n17344]:\n\n| Diagnostic Code | Blink Pattern | Subsystem | Root Cause & Required Action |\n| :--- | :--- | :--- | :--- |\n| `LED-BLINK-2.2` | 2 Long, 2 Short (Red/White) | System BIOS Flash | Main BIOS image corrupted (`sp148210`). Connect AC power and allow **HP Sure Start** (8 MB isolated flash) to restore the Golden BIOS image, or press `Win+B` + `Power`. See [no-boot-bios-sure-start-recovery](../playbooks/no-boot-bios-sure-start-recovery.md). |\n| `LED-BLINK-3.2` | 3 Long, 2 Short | Memory (`LPDDR5-6400`) | Pre-video memory initialization failure. Because LPDDR5 memory is soldered, replace the SKU-matched System Board from [hardware_components_catalog](../tables/hardware_components_catalog.md). |\n| `LED-BLINK-5.2` | 5 Long, 2 Short | Embedded Controller (EC) | EC firmware failure or board power rail short. Perform a 15-second hard EC reset; if persistent, replace the System Board. |\n| `LED-PWR-BLINK-WHITE` | Continuous White Blink (Power LED) | ACPI Modern Standby (`S0ix`) | System is in Modern Standby. If accompanied by chassis heat inside a bag, update BIOS (`sp148210`) to disable network-triggered wake in battery mode. |\n\nLinked structured concepts:\n- [diagnostic_codes_reference](../tables/diagnostic_codes_reference.md)\n- [community_troubleshooting_cases](../tables/community_troubleshooting_cases.md)\n- [firmware_bios_and_nvm](../tables/firmware_bios_and_nvm.md)\n\n[^hp-msg-n17344]: HP Dragonfly Folio 13.5 inch G3 Maintenance and Service Guide, Chapter 7 (pp. 77\u201384)", "references/thunderbolt-4-port-and-dock-architecture": "# External Port & Docking Architecture\n\nChapter 1 (p. 3) and Chapter 2 (pp. 5\u20137) specify the external interface architecture modeled in [ports_sensors_and_docks](../tables/ports_sensors_and_docks.md)[^hp-msg-n17344]:\n\n- **Dual Left-Side SuperSpeed USB Type-C / Thunderbolt 4 Ports (Folio G3):** Both left-side ports support 40 Gbps data transfer, USB Power Delivery charging, and DisplayPort 1.4 video output. (On the clamshell Elite Dragonfly G3, one Thunderbolt 4 port sits on the left and one on the right.)\n- **3.5mm Audio Combo Jack Hardware Cutoff (Manual p. 6):** When a plug or debris is detected inside the right-side 3.5mm audio jack (`N31280-001`), the internal Bang & Olufsen quad speakers (`N22946-001`) are automatically muted in hardware. This is a primary root cause checked in case `TS-DFG3-003` of [community_troubleshooting_cases](../tables/community_troubleshooting_cases.md).\n- **Official Enterprise Docks:** Validated with the HP Thunderbolt 120W G4 Dock (`M97105-001`) and 280W G4 Combo Dock (`M97106-001`) running dock firmware SoftPaq `sp149503` in [firmware_bios_and_nvm](../tables/firmware_bios_and_nvm.md).\n\n[^hp-msg-n17344]: HP Dragonfly Folio 13.5 inch G3 Maintenance and Service Guide, Chapters 1 & 2 (pp. 3, 5\u20137)", "tables/community_troubleshooting_cases": "# Overview\n\n`hp-dragonfly.prj_ontology_hp_dragonfly.community_troubleshooting_cases` (12 rows) \u2014 Real-world hardware, firmware, and OS troubleshooting cases collected from HP Support Community, Reddit, and enterprise field escalations (Node Table: TroubleshootingCase)[^bq-source]\n\nBridges unstructured customer symptoms (black screen after BIOS update, dual 4K dock flicker, Windows 11 Intel SST red X audio loss, Modern Standby hot-bag drain, 8 MP camera disconnect, 5G WWAN thermal throttling) to structured diagnostic codes (`error_or_diagnostic_code`), SoftPaq fixes (`resolving_softpaq_id`), and exact replacement spare parts (`affected_part_number`).[^hp-msg-n17344]\n\n- **BigQuery Property Graph Role:** Node Table (`TroubleshootingCase`, Key: `case_id`) & Edge Tables (`AFFECTS_COMPONENT`, `TRIGGERS_DIAGNOSTIC`)\n- **Grounded Service Manual Section:** Cross-links Chapters 3, 5, 6, and 7 of Service Guide N17344-001 with field incident reports[^hp-msg-n17344]\n\n# Schema\n\n| Column | Type | Mode | Description |\n| :--- | :--- | :--- | :--- |\n| `case_id` | `STRING` | `REQUIRED` | Unique troubleshooting case ID (Primary Key, e.g., TS-DFG3-001) |\n| `model_id` | `STRING` | `REQUIRED` | Affected model ID (FK -> dragonfly_series_models.model_id) |\n| `sku_id` | `STRING` | `NULLABLE` | Representative affected SKU ID (FK -> product_skus_and_configs.sku_id) |\n| `issue_category` | `STRING` | `REQUIRED` | Issue domain (BIOS & Boot, Thunderbolt & Docking, Audio & Mic, Camera & Presence, Battery & Standby, Thermal & Fan, WWAN & 5G, Display & Sure View, Pen & Charging, Linux Compatibility) |\n| `severity` | `STRING` | `REQUIRED` | Impact severity level (CRITICAL, HIGH, MEDIUM, LOW) |\n| `source_channel` | `STRING` | `REQUIRED` | Reporting source channel (HP Support Community, Reddit r/Hewlett_Packard, Enterprise Field Escalation, Linux Kernel Bugzilla) |\n| `reported_symptom` | `STRING` | `REQUIRED` | Detailed user-reported symptom and failure behavior in English |\n| `error_or_diagnostic_code` | `STRING` | `NULLABLE` | Associated diagnostic or blink code (FK -> diagnostic_codes_reference.diagnostic_code) |\n| `affected_part_number` | `STRING` | `NULLABLE` | Root-cause or replacement HP spare part number (FK -> hardware_components_catalog.part_number) |\n| `resolving_softpaq_id` | `STRING` | `NULLABLE` | Resolving BIOS or driver SoftPaq ID (FK -> firmware_bios_and_nvm.softpaq_id) |\n| `root_cause_analysis` | `STRING` | `REQUIRED` | Technical root cause analysis in English |\n| `resolution_steps` | `STRING` | `REQUIRED` | Step-by-step troubleshooting and remediation procedure in English |\n| `requires_part_replacement` | `BOOLEAN` | `REQUIRED` | Whether physical hardware component (FRU) replacement is required |\n| `occurrence_count` | `INTEGER` | `REQUIRED` | Number of similar community/field incident reports |\n| `avg_resolution_time_min` | `INTEGER` | `REQUIRED` | Average time to resolution in minutes |\n\n# Cross-Concept Links\n\n**Related BigQuery Tables:**\n- [`tables/dragonfly_series_models`](dragonfly_series_models.md)\n- [`tables/product_skus_and_configs`](product_skus_and_configs.md)\n- [`tables/hardware_components_catalog`](hardware_components_catalog.md)\n- [`tables/component_disassembly_deps`](component_disassembly_deps.md)\n- [`tables/firmware_bios_and_nvm`](firmware_bios_and_nvm.md)\n- [`tables/diagnostic_codes_reference`](diagnostic_codes_reference.md)\n\n**Grounded Manual References:**\n- [`references/post-led-blink-and-uefi-diagnostics`](../references/post-led-blink-and-uefi-diagnostics.md)\n- [`references/bios-nvm-and-hp-sure-start-security`](../references/bios-nvm-and-hp-sure-start-security.md)\n- [`references/disassembly-prerequisite-graph-and-esd`](../references/disassembly-prerequisite-graph-and-esd.md)\n\n# Examples\n\n```sql\nSELECT\n  case_id,\n  model_id,\n  issue_category,\n  severity,\n  error_or_diagnostic_code,\n  affected_part_number,\n  resolving_softpaq_id,\n  requires_part_replacement,\n  occurrence_count,\n  avg_resolution_time_min\nFROM `hp-dragonfly.prj_ontology_hp_dragonfly.community_troubleshooting_cases`\nORDER BY occurrence_count DESC;\n```\n\n[^bq-source]: BigQuery Table `hp-dragonfly.prj_ontology_hp_dragonfly.community_troubleshooting_cases`\n[^hp-msg-n17344]: HP Dragonfly Folio 13.5 inch G3 Maintenance and Service Guide (Doc Part N17344-001)", "tables/component_disassembly_deps": "# Overview\n\n`hp-dragonfly.prj_ontology_hp_dragonfly.component_disassembly_deps` (15 rows) \u2014 Physical disassembly prerequisite edges defining which component must be removed before another component (Edge Table: REQUIRES_REMOVAL_OF)[^bq-source]\n\nEncodes the physical service dependency DAG from Chapter 5 of N17344-001. For example, replacing System Board `N20728-601` requires ordered removal of Bottom Cover `N22918-001` (Step 1), Battery `M90788-005` (Step 2), and Heat Sink/Dual Fan Assembly `N22936-001` (Step 3), while replacing the 8 MP Camera Module `N23306-001` requires removing the stretch-release adhesive display panel `N23305-001` and Display Hub Board `N22937-001`.[^hp-msg-n17344]\n\n- **BigQuery Property Graph Role:** Edge Table (`REQUIRES_REMOVAL_OF`: `HardwareComponent` -> `HardwareComponent`)\n- **Grounded Service Manual Section:** Chapter 5: Removal and Replacement Procedures (pp. 32\u201372), Chapter 8: Screw Listing & ESD Specifications (pp. 85\u201390)[^hp-msg-n17344]\n\n# Schema\n\n| Column | Type | Mode | Description |\n| :--- | :--- | :--- | :--- |\n| `dependency_id` | `STRING` | `REQUIRED` | Unique disassembly dependency rule ID (Primary Key) |\n| `model_id` | `STRING` | `REQUIRED` | Target model ID (FK -> dragonfly_series_models.model_id) |\n| `target_part_number` | `STRING` | `REQUIRED` | Target spare part number to be serviced/removed (FK -> hardware_components_catalog.part_number) |\n| `target_component_name` | `STRING` | `REQUIRED` | Target component name |\n| `prerequisite_part_number` | `STRING` | `REQUIRED` | Prerequisite spare part number that must be removed first (FK -> hardware_components_catalog.part_number) |\n| `prerequisite_component_name` | `STRING` | `REQUIRED` | Prerequisite component name |\n| `step_order` | `INTEGER` | `REQUIRED` | Ordered disassembly prerequisite sequence step (1, 2, 3...) |\n| `fastener_screw_spec` | `STRING` | `REQUIRED` | Fastener screw dimensions and connector types (e.g., 5x Torx T5 + 2x Phillips M2.0x4.0, ZIF connector) |\n| `required_tools` | `STRING` | `REQUIRED` | Required service tools (e.g., Magnetic Phillips P0/P1, Torx T5, Nonconductive pry tool, Tweezers) |\n| `caution_note` | `STRING` | `REQUIRED` | Critical service caution note to prevent hardware damage during disassembly/reassembly |\n| `manual_page_ref` | `STRING` | `REQUIRED` | Service manual page reference (e.g., N17344-001 p.35-36) |\n\n# Cross-Concept Links\n\n**Related BigQuery Tables:**\n- [`tables/hardware_components_catalog`](hardware_components_catalog.md)\n- [`tables/community_troubleshooting_cases`](community_troubleshooting_cases.md)\n\n**Grounded Manual References:**\n- [`references/disassembly-prerequisite-graph-and-esd`](../references/disassembly-prerequisite-graph-and-esd.md)\n- [`references/oled-camera-and-cable-replacement`](../references/oled-camera-and-cable-replacement.md)\n\n# Examples\n\n```sql\nSELECT\n  d.dependency_id,\n  d.target_part_number,\n  t.component_name AS target_component,\n  d.step_order,\n  d.prerequisite_part_number,\n  p.component_name AS prerequisite_component,\n  d.fastener_screw_spec,\n  d.caution_note\nFROM `hp-dragonfly.prj_ontology_hp_dragonfly.component_disassembly_deps` AS d\nJOIN `hp-dragonfly.prj_ontology_hp_dragonfly.hardware_components_catalog` AS t\n  ON d.target_part_number = t.part_number\nJOIN `hp-dragonfly.prj_ontology_hp_dragonfly.hardware_components_catalog` AS p\n  ON d.prerequisite_part_number = p.part_number\nORDER BY d.target_part_number, d.step_order;\n```\n\n[^bq-source]: BigQuery Table `hp-dragonfly.prj_ontology_hp_dragonfly.component_disassembly_deps`\n[^hp-msg-n17344]: HP Dragonfly Folio 13.5 inch G3 Maintenance and Service Guide (Doc Part N17344-001)", "tables/diagnostic_codes_reference": "# Overview\n\n`hp-dragonfly.prj_ontology_hp_dragonfly.diagnostic_codes_reference` (8 rows) \u2014 HP PC Hardware Diagnostics UEFI/Windows failure codes, power/battery LED blink patterns, and ESD/thermal thresholds (Node Table: DiagnosticCode)[^bq-source]\n\nStandardizes hardware symptom codes including `LED-BLINK-2.2` (Main area of BIOS corrupted -> HP Sure Start recovery), `LED-BLINK-3.2` (Pre-video memory error on soldered LPDDR5 -> System Board replacement), `LED-BLINK-5.2` (Embedded Controller failure), `UEFI-24DIGIT-NVME-DST-FAIL`, and the 700V (0.7 kV) MOS electrostatic discharge damage threshold.[^hp-msg-n17344]\n\n- **BigQuery Property Graph Role:** Node Table (`DiagnosticCode`, Key: `diagnostic_code`)\n- **Grounded Service Manual Section:** Chapter 7: Troubleshooting & POST Diagnostic Blink Codes (pp. 77\u201384), Chapter 8: Electrostatic Discharge (pp. 85\u201386)[^hp-msg-n17344]\n\n# Schema\n\n| Column | Type | Mode | Description |\n| :--- | :--- | :--- | :--- |\n| `diagnostic_code` | `STRING` | `REQUIRED` | Unique diagnostic code or LED blink identifier (Primary Key, e.g., LED-CAPS-3-2, UEFI-24DIGIT-SSD) |\n| `diagnostic_category` | `STRING` | `REQUIRED` | Diagnostic category (Power/Battery LED, CapsLock Blink Code, UEFI Hardware Diagnostics, ESD Threshold) |\n| `signal_pattern` | `STRING` | `REQUIRED` | Observed LED blink pattern, failure code format, or voltage measurement |\n| `indicated_condition` | `STRING` | `REQUIRED` | Hardware fault or system condition indicated by the pattern |\n| `Suspected_component_category` | `STRING` | `REQUIRED` | Primary suspected hardware component category |\n| `recommended_action` | `STRING` | `REQUIRED` | Official HP recommended troubleshooting and remediation action |\n| `manual_reference` | `STRING` | `REQUIRED` | Service manual chapter and page citation |\n\n# Cross-Concept Links\n\n**Related BigQuery Tables:**\n- [`tables/community_troubleshooting_cases`](community_troubleshooting_cases.md)\n- [`tables/hardware_components_catalog`](hardware_components_catalog.md)\n\n**Grounded Manual References:**\n- [`references/post-led-blink-and-uefi-diagnostics`](../references/post-led-blink-and-uefi-diagnostics.md)\n- [`references/no-boot-bios-sure-start-recovery`](../references/no-boot-bios-sure-start-recovery.md)\n\n# Examples\n\n```sql\nSELECT\n  diagnostic_code,\n  signal_type,\n  blink_pattern_or_code,\n  subsystem_affected,\n  root_cause_meaning,\n  recommended_action,\n  manual_page_ref\nFROM `hp-dragonfly.prj_ontology_hp_dragonfly.diagnostic_codes_reference`\nORDER BY diagnostic_code;\n```\n\n[^bq-source]: BigQuery Table `hp-dragonfly.prj_ontology_hp_dragonfly.diagnostic_codes_reference`\n[^hp-msg-n17344]: HP Dragonfly Folio 13.5 inch G3 Maintenance and Service Guide (Doc Part N17344-001)", "tables/dragonfly_series_models": "# Overview\n\n`hp-dragonfly.prj_ontology_hp_dragonfly.dragonfly_series_models` (6 rows) \u2014 Master lineup and physical specifications for the HP Dragonfly product family (G1, G2, Max, G3, Folio G3, G4) (Node Table: ProductModel)[^bq-source]\n\nCaptures the structural evolution of the HP Dragonfly product line from G1/G2/Max (13.3-inch 16:9 convertible clamshell) to the G3 (13.5-inch 3:2 ultralight clamshell) and the Folio G3 (13.5-inch 3:2 pull-forward magnesium/aluminum convertible with wrap-around polyurethane leather). All SKUs in [product_skus_and_configs](product_skus_and_configs.md) and field cases in [community_troubleshooting_cases](community_troubleshooting_cases.md) anchor to `model_id`.[^hp-msg-n17344]\n\n- **BigQuery Property Graph Role:** Node Table (`ProductModel`, Key: `model_id`)\n- **Grounded Service Manual Section:** Chapter 1: Product Description (pp. 1\u20134), Chapter 2: Getting to Know the Computer (pp. 5\u201316)[^hp-msg-n17344]\n\n# Schema\n\n| Column | Type | Mode | Description |\n| :--- | :--- | :--- | :--- |\n| `model_id` | `STRING` | `REQUIRED` | Unique model identifier (Primary Key, e.g., MDL-DF-G3, MDL-DF-FOLIO-G3) |\n| `model_name` | `STRING` | `REQUIRED` | Official HP commercial product name (e.g., HP Elite Dragonfly G3 Notebook PC) |\n| `generation` | `STRING` | `REQUIRED` | Generation designation (G1, G2, Max, G3, Folio G3, G4) |\n| `release_year` | `INTEGER` | `REQUIRED` | Commercial release year |\n| `form_factor` | `STRING` | `REQUIRED` | Chassis form factor (Clamshell 180\u00b0, 360\u00b0 Convertible 2-in-1, Pull-Forward Folio 2-in-1) |\n| `cpu_architecture` | `STRING` | `REQUIRED` | Supported Intel Core processor generation and series |\n| `display_size_inch` | `FLOAT` | `REQUIRED` | Active display diagonal size in inches |\n| `aspect_ratio` | `STRING` | `REQUIRED` | Display aspect ratio (16:9 or 3:2) |\n| `memory_type` | `STRING` | `REQUIRED` | System memory specification (LPDDR3, LPDDR4x, LPDDR5-6400, soldered onboard status) |\n| `max_memory_gb` | `INTEGER` | `REQUIRED` | Maximum supported system memory capacity in GB |\n| `max_storage_tb` | `FLOAT` | `REQUIRED` | Maximum supported M.2 PCIe NVMe SSD capacity in TB |\n| `camera_spec` | `STRING` | `REQUIRED` | Integrated webcam, IR sensor, and privacy shutter/key specifications |\n| `audio_spec` | `STRING` | `REQUIRED` | Audio subsystem, speaker configuration, and microphone specifications |\n| `battery_options` | `STRING` | `REQUIRED` | Supported battery cell count and watt-hour (Whr) options |\n| `starting_weight_kg` | `FLOAT` | `REQUIRED` | Minimum starting weight in kilograms (kg) |\n| `dimensions_mm` | `STRING` | `REQUIRED` | Physical dimensions (Width x Depth x Height in mm) |\n| `chassis_material` | `STRING` | `REQUIRED` | Chassis construction material and finish color options |\n| `service_manual_doc_no` | `STRING` | `NULLABLE` | Official HP Maintenance and Service Guide document part number (e.g., N17344-001) |\n\n# Cross-Concept Links\n\n**Related BigQuery Tables:**\n- [`tables/product_skus_and_configs`](product_skus_and_configs.md)\n- [`tables/hardware_components_catalog`](hardware_components_catalog.md)\n- [`tables/ports_sensors_and_docks`](ports_sensors_and_docks.md)\n- [`tables/firmware_bios_and_nvm`](firmware_bios_and_nvm.md)\n- [`tables/community_troubleshooting_cases`](community_troubleshooting_cases.md)\n\n**Grounded Manual References:**\n- [`references/hp-folio-g3-service-manual-n17344`](../references/hp-folio-g3-service-manual-n17344.md)\n- [`references/thunderbolt-4-port-and-dock-architecture`](../references/thunderbolt-4-port-and-dock-architecture.md)\n\n# Examples\n\n```sql\nSELECT\n  model_id,\n  model_name,\n  generation,\n  form_factor,\n  cpu_architecture,\n  aspect_ratio,\n  min_weight_kg,\n  service_manual_doc_id\nFROM `hp-dragonfly.prj_ontology_hp_dragonfly.dragonfly_series_models`\nORDER BY release_year, model_id;\n```\n\n[^bq-source]: BigQuery Table `hp-dragonfly.prj_ontology_hp_dragonfly.dragonfly_series_models`\n[^hp-msg-n17344]: HP Dragonfly Folio 13.5 inch G3 Maintenance and Service Guide (Doc Part N17344-001)", "tables/edge_case_governed_by_playbook": "# Overview\n\n`hp-dragonfly.prj_ontology_hp_dragonfly.edge_case_governed_by_playbook` (12 rows) \u2014 Cross-Layer ONT-to-LEX Bridge Edge Table: TroubleshootingCase -> ServicePlaybook (GOVERNED_BY_PLAYBOOK).[^bq-source]\n\n[^hp-msg-n17344]\n\n- **BigQuery Property Graph Role:** Structured Table\n- **Grounded Service Manual Section:** HP Service Guide N17344-001[^hp-msg-n17344]\n\n# Schema\n\n| Column | Type | Mode | Description |\n| :--- | :--- | :--- | :--- |\n| `bridge_id` | `STRING` | `REQUIRED` | Unique ONT-to-LEX case-playbook bridge ID |\n| `case_id` | `STRING` | `REQUIRED` | Source TroubleshootingCase case_id |\n| `playbook_id` | `STRING` | `REQUIRED` | Destination ServicePlaybook playbook_id |\n| `issue_category` | `STRING` | `REQUIRED` | Troubleshooting issue domain |\n| `bridge_role` | `STRING` | `REQUIRED` | Semantic bridge role description |\n\n# Cross-Concept Links\n\n**Related BigQuery Tables:**\n\n\n**Grounded Manual References:**\n\n\n# Examples\n\n```sql\nSELECT * FROM `hp-dragonfly.prj_ontology_hp_dragonfly.edge_case_governed_by_playbook` LIMIT 10;\n```\n\n[^bq-source]: BigQuery Table `hp-dragonfly.prj_ontology_hp_dragonfly.edge_case_governed_by_playbook`\n[^hp-msg-n17344]: HP Dragonfly Folio 13.5 inch G3 Maintenance and Service Guide (Doc Part N17344-001)", "tables/edge_component_documented_in_chapter": "# Overview\n\n`hp-dragonfly.prj_ontology_hp_dragonfly.edge_component_documented_in_chapter` (38 rows) \u2014 Cross-Layer ONT-to-LEX Bridge Edge Table: HardwareComponent -> ServiceManualChapter (DOCUMENTED_IN_CHAPTER).[^bq-source]\n\n[^hp-msg-n17344]\n\n- **BigQuery Property Graph Role:** Structured Table\n- **Grounded Service Manual Section:** HP Service Guide N17344-001[^hp-msg-n17344]\n\n# Schema\n\n| Column | Type | Mode | Description |\n| :--- | :--- | :--- | :--- |\n| `bridge_id` | `STRING` | `REQUIRED` | Unique ONT-to-LEX component bridge ID |\n| `part_number` | `STRING` | `REQUIRED` | Source HardwareComponent part_number |\n| `chapter_slot_id` | `STRING` | `REQUIRED` | Destination ServiceManualChapter chapter_slot_id |\n| `manual_chapter_page` | `STRING` | `REQUIRED` | PDF chapter and page citation |\n| `bridge_role` | `STRING` | `REQUIRED` | Semantic bridge role description |\n\n# Cross-Concept Links\n\n**Related BigQuery Tables:**\n\n\n**Grounded Manual References:**\n\n\n# Examples\n\n```sql\nSELECT * FROM `hp-dragonfly.prj_ontology_hp_dragonfly.edge_component_documented_in_chapter` LIMIT 10;\n```\n\n[^bq-source]: BigQuery Table `hp-dragonfly.prj_ontology_hp_dragonfly.edge_component_documented_in_chapter`\n[^hp-msg-n17344]: HP Dragonfly Folio 13.5 inch G3 Maintenance and Service Guide (Doc Part N17344-001)", "tables/edge_diagnostic_defined_in_chapter": "# Overview\n\n`hp-dragonfly.prj_ontology_hp_dragonfly.edge_diagnostic_defined_in_chapter` (8 rows) \u2014 Cross-Layer ONT-to-LEX Bridge Edge Table: DiagnosticCode -> ServiceManualChapter (DEFINED_IN_CH6_MANUAL).[^bq-source]\n\n[^hp-msg-n17344]\n\n- **BigQuery Property Graph Role:** Structured Table\n- **Grounded Service Manual Section:** HP Service Guide N17344-001[^hp-msg-n17344]\n\n# Schema\n\n| Column | Type | Mode | Description |\n| :--- | :--- | :--- | :--- |\n| `bridge_id` | `STRING` | `REQUIRED` | Unique ONT-to-LEX diagnostic bridge ID |\n| `diagnostic_code` | `STRING` | `REQUIRED` | Source DiagnosticCode diagnostic_code |\n| `chapter_slot_id` | `STRING` | `REQUIRED` | Destination ServiceManualChapter chapter_slot_id |\n| `manual_reference` | `STRING` | `REQUIRED` | PDF Chapter 6 page citation |\n| `bridge_role` | `STRING` | `REQUIRED` | Semantic bridge role description |\n\n# Cross-Concept Links\n\n**Related BigQuery Tables:**\n\n\n**Grounded Manual References:**\n\n\n# Examples\n\n```sql\nSELECT * FROM `hp-dragonfly.prj_ontology_hp_dragonfly.edge_diagnostic_defined_in_chapter` LIMIT 10;\n```\n\n[^bq-source]: BigQuery Table `hp-dragonfly.prj_ontology_hp_dragonfly.edge_diagnostic_defined_in_chapter`\n[^hp-msg-n17344]: HP Dragonfly Folio 13.5 inch G3 Maintenance and Service Guide (Doc Part N17344-001)", "tables/edge_playbook_orchestrates_chapter": "# Overview\n\n`hp-dragonfly.prj_ontology_hp_dragonfly.edge_playbook_orchestrates_chapter` (8 rows) \u2014 LEX Layer Edge Table: ServicePlaybook -> ServiceManualChapter (ORCHESTRATES_REFERENCE).[^bq-source]\n\n[^hp-msg-n17344]\n\n- **BigQuery Property Graph Role:** Structured Table\n- **Grounded Service Manual Section:** HP Service Guide N17344-001[^hp-msg-n17344]\n\n# Schema\n\n| Column | Type | Mode | Description |\n| :--- | :--- | :--- | :--- |\n| `bridge_id` | `STRING` | `REQUIRED` | Unique LEX playbook-to-chapter edge ID |\n| `playbook_id` | `STRING` | `REQUIRED` | Source ServicePlaybook playbook_id |\n| `chapter_slot_id` | `STRING` | `REQUIRED` | Destination ServiceManualChapter chapter_slot_id |\n| `citation_role` | `STRING` | `REQUIRED` | How the playbook uses this reference chapter |\n\n# Cross-Concept Links\n\n**Related BigQuery Tables:**\n\n\n**Grounded Manual References:**\n\n\n# Examples\n\n```sql\nSELECT * FROM `hp-dragonfly.prj_ontology_hp_dragonfly.edge_playbook_orchestrates_chapter` LIMIT 10;\n```\n\n[^bq-source]: BigQuery Table `hp-dragonfly.prj_ontology_hp_dragonfly.edge_playbook_orchestrates_chapter`\n[^hp-msg-n17344]: HP Dragonfly Folio 13.5 inch G3 Maintenance and Service Guide (Doc Part N17344-001)", "tables/firmware_bios_and_nvm": "# Overview\n\n`hp-dragonfly.prj_ontology_hp_dragonfly.firmware_bios_and_nvm` (8 rows) \u2014 System BIOS releases, SoftPaq driver packages, and Nonvolatile Memory (NVM) / TPM 2.0 security specifications[^bq-source]\n\nMaps SoftPaq packages (`sp148210` BIOS U95, `sp146831` Intel Smart Sound Technology, `sp149503` Thunderbolt Dock G4 Firmware, `sp147415` Intel 5000 5G WWAN) and onboard SPI/NVM flash chips (64 Mbit / 8 MB isolated HP Sure Start Golden BIOS flash, 72 Mbit / 9 MB System BIOS, 56 Mbit / 7 MB Intel CSE/ME, Infineon SLB9672 TPM 2.0).[^hp-msg-n17344]\n\n- **BigQuery Property Graph Role:** Firmware & Security Reference Table\n- **Grounded Service Manual Section:** Chapter 6: Backing Up, Restoring, and Recovering (pp. 73\u201376), Appendix B: Non-Volatile Memory & HP Sure Start (pp. 87\u201389)[^hp-msg-n17344]\n\n# Schema\n\n| Column | Type | Mode | Description |\n| :--- | :--- | :--- | :--- |\n| `release_or_nvm_id` | `STRING` | `REQUIRED` | Unique firmware, driver, or NVM item identifier (Primary Key) |\n| `model_id` | `STRING` | `REQUIRED` | Target model ID (FK -> dragonfly_series_models.model_id) |\n| `item_type` | `STRING` | `REQUIRED` | Item classification (System BIOS, Driver SoftPaq, Dock Firmware, Nonvolatile Memory, Security Chip) |\n| `name_or_version` | `STRING` | `REQUIRED` | Firmware version or nonvolatile memory component name |\n| `softpaq_id` | `STRING` | `NULLABLE` | Official HP SoftPaq package identifier (e.g., sp148210) |\n| `storage_size` | `STRING` | `NULLABLE` | Nonvolatile memory capacity or SoftPaq package size (e.g., 8 MB, 9 MB, 7 MB) |\n| `stores_customer_data` | `BOOLEAN` | `REQUIRED` | Whether the nonvolatile memory stores customer/personal data (per Chapter 10 Statement of Memory Volatility) |\n| `retains_data_power_off` | `BOOLEAN` | `REQUIRED` | Whether data is retained when all power sources are removed |\n| `write_protection_mechanism` | `STRING` | `REQUIRED` | Hardware/cryptographic write-protection mechanism (HP Sure Start EC, Intel Digitally Signed Utility) |\n| `sanitization_or_update_steps` | `STRING` | `REQUIRED` | Standard BIOS sanitization (Secure Erase / Factory Reset) or firmware update instructions |\n\n# Cross-Concept Links\n\n**Related BigQuery Tables:**\n- [`tables/dragonfly_series_models`](dragonfly_series_models.md)\n- [`tables/community_troubleshooting_cases`](community_troubleshooting_cases.md)\n\n**Grounded Manual References:**\n- [`references/bios-nvm-and-hp-sure-start-security`](../references/bios-nvm-and-hp-sure-start-security.md)\n- [`references/no-boot-bios-sure-start-recovery`](../references/no-boot-bios-sure-start-recovery.md)\n\n# Examples\n\n```sql\nSELECT\n  firmware_id,\n  component_type,\n  softpaq_id,\n  version_string,\n  nvm_chip_capacity_mbit,\n  hardware_root_of_trust,\n  remediation_target\nFROM `hp-dragonfly.prj_ontology_hp_dragonfly.firmware_bios_and_nvm`\nORDER BY firmware_id;\n```\n\n[^bq-source]: BigQuery Table `hp-dragonfly.prj_ontology_hp_dragonfly.firmware_bios_and_nvm`\n[^hp-msg-n17344]: HP Dragonfly Folio 13.5 inch G3 Maintenance and Service Guide (Doc Part N17344-001)", "tables/hardware_components_catalog": "# Overview\n\n`hp-dragonfly.prj_ontology_hp_dragonfly.hardware_components_catalog` (38 rows) \u2014 Official spare parts catalog for HP Dragonfly G3 and Folio G3 including major components, display subcomponents, and kits (Node Table: HardwareComponent)[^bq-source]\n\nContains 38 official HP spare parts across System Boards, Memory (Soldered), Primary Storage (M.2 2280 PCIe Gen4x4 NVMe SSDs), Battery (`M90788-005`), Thermal (`N22936-001`), WWAN/WLAN modules, Display Subcomponents (`N23304-001`, `N23305-001`, `N23306-001`), and Top Cover/Keyboard assemblies. Distinguishes Customer Self-Repair (`CUSTOMER_SELF_Repair_OPTIONAL`) from `AUTHORIZED_SERVICE_PROVIDER_ONLY` components.[^hp-msg-n17344]\n\n- **BigQuery Property Graph Role:** Node Table (`HardwareComponent`, Key: `part_number`)\n- **Grounded Service Manual Section:** Chapter 3: Illustrated Parts Catalog (pp. 17\u201328), Chapter 5: Removal and Replacement Procedures (pp. 32\u201372)[^hp-msg-n17344]\n\n# Schema\n\n| Column | Type | Mode | Description |\n| :--- | :--- | :--- | :--- |\n| `part_number` | `STRING` | `REQUIRED` | Official HP Spare Part Number (Primary Key, e.g., M90788-005, M52027-005, N20728-601) |\n| `model_id` | `STRING` | `REQUIRED` | Compatible model ID (FK -> dragonfly_series_models.model_id) |\n| `component_category` | `STRING` | `REQUIRED` | Component category (System Board, Solid-State Drive, Battery, Display Subcomponent, Thermal, WWAN, Audio, Input/Cover, Kit/Accessory) |\n| `component_name` | `STRING` | `REQUIRED` | Official component name |\n| `technical_specs` | `STRING` | `REQUIRED` | Detailed component technical specifications, capacity, interface, and included accessories |\n| `serviceability_tier` | `STRING` | `REQUIRED` | Service replacement tier (End-User Replaceable, Authorized Service Provider Only) |\n| `esd_sensitive` | `BOOLEAN` | `REQUIRED` | Whether the part is sensitive to Electrostatic Discharge (degrades at >= 700V) |\n| `requires_thermal_paste` | `BOOLEAN` | `REQUIRED` | Whether thermal grease or thermal pad replacement is required during service |\n| `manual_chapter_page` | `STRING` | `REQUIRED` | Reference chapter and page numbers in the HP Maintenance and Service Guide |\n| `estimated_replace_min` | `INTEGER` | `REQUIRED` | Standard estimated service replacement time in minutes |\n| `unit_price_usd` | `FLOAT` | `REQUIRED` | Reference spare part unit price in USD |\n\n# Cross-Concept Links\n\n**Related BigQuery Tables:**\n- [`tables/component_disassembly_deps`](component_disassembly_deps.md)\n- [`tables/product_skus_and_configs`](product_skus_and_configs.md)\n- [`tables/community_troubleshooting_cases`](community_troubleshooting_cases.md)\n\n**Grounded Manual References:**\n- [`references/hp-folio-g3-service-manual-n17344`](../references/hp-folio-g3-service-manual-n17344.md)\n- [`references/disassembly-prerequisite-graph-and-esd`](../references/disassembly-prerequisite-graph-and-esd.md)\n\n# Examples\n\n```sql\nSELECT\n  part_number,\n  component_category,\n  component_name,\n  serviceability_tier,\n  is_soldered,\n  requires_thermal_paste_renewal,\n  manual_page_ref\nFROM `hp-dragonfly.prj_ontology_hp_dragonfly.hardware_components_catalog`\nORDER BY component_category, part_number;\n```\n\n[^bq-source]: BigQuery Table `hp-dragonfly.prj_ontology_hp_dragonfly.hardware_components_catalog`\n[^hp-msg-n17344]: HP Dragonfly Folio 13.5 inch G3 Maintenance and Service Guide (Doc Part N17344-001)", "tables/lex_manual_chapters": "# Overview\n\n`hp-dragonfly.prj_ontology_hp_dragonfly.lex_manual_chapters` (5 rows) \u2014 Unstructured LEX Node Table: 5 OKF v0.2 reference chapters extracted from N17344-001 with Dataplex kc_entry_id.[^bq-source]\n\n[^hp-msg-n17344]\n\n- **BigQuery Property Graph Role:** Structured Table\n- **Grounded Service Manual Section:** HP Service Guide N17344-001[^hp-msg-n17344]\n\n# Schema\n\n| Column | Type | Mode | Description |\n| :--- | :--- | :--- | :--- |\n| `chapter_slot_id` | `STRING` | `REQUIRED` | Canonical OKF reference chapter ID |\n| `doc_id` | `STRING` | `REQUIRED` | Parent source document ID (FK -> lex_service_manual_documents.doc_id) |\n| `chapter_no` | `STRING` | `REQUIRED` | Manual chapter or appendix number |\n| `chapter_title` | `STRING` | `REQUIRED` | English title of the extracted OKF reference document |\n| `pdf_page_start` | `INTEGER` | `REQUIRED` | Starting page number in pdf_6290467_en-US-1.pdf |\n| `pdf_page_span` | `STRING` | `REQUIRED` | Page range in the 109-page service manual |\n| `okf_rel_path` | `STRING` | `REQUIRED` | Relative path inside bundles/hp_dragonfly/ |\n| `kc_entry_id` | `STRING` | `REQUIRED` | Dataplex Knowledge Catalog Entry FQN in okf_hp_dragonfly |\n| `governance_summary` | `STRING` | `REQUIRED` | Engineering rules and constraints governed by this chapter |\n\n# Cross-Concept Links\n\n**Related BigQuery Tables:**\n\n\n**Grounded Manual References:**\n\n\n# Examples\n\n```sql\nSELECT * FROM `hp-dragonfly.prj_ontology_hp_dragonfly.lex_manual_chapters` LIMIT 10;\n```\n\n[^bq-source]: BigQuery Table `hp-dragonfly.prj_ontology_hp_dragonfly.lex_manual_chapters`\n[^hp-msg-n17344]: HP Dragonfly Folio 13.5 inch G3 Maintenance and Service Guide (Doc Part N17344-001)", "tables/lex_service_manual_documents": "# Overview\n\n`hp-dragonfly.prj_ontology_hp_dragonfly.lex_service_manual_documents` (2 rows) \u2014 Unstructured LEX Node Table: Origin HP Service Guide PDF roots linked to Dataplex Knowledge Catalog (okf_hp_dragonfly).[^bq-source]\n\n[^hp-msg-n17344]\n\n- **BigQuery Property Graph Role:** Structured Table\n- **Grounded Service Manual Section:** HP Service Guide N17344-001[^hp-msg-n17344]\n\n# Schema\n\n| Column | Type | Mode | Description |\n| :--- | :--- | :--- | :--- |\n| `doc_id` | `STRING` | `REQUIRED` | Canonical document root ID (e.g., N17344-001) |\n| `doc_title` | `STRING` | `REQUIRED` | Official document title in English |\n| `pdf_filename` | `STRING` | `REQUIRED` | Source unstructured PDF filename |\n| `total_pages` | `INTEGER` | `REQUIRED` | Total page count of the source PDF manual |\n| `sha256` | `STRING` | `REQUIRED` | SHA-256 cryptographic digest of the origin PDF |\n| `okf_root_path` | `STRING` | `REQUIRED` | OKF v0.2 bundle root index path |\n| `kc_entry_id` | `STRING` | `REQUIRED` | Dataplex Knowledge Catalog Entry FQN in okf_hp_dragonfly |\n\n# Cross-Concept Links\n\n**Related BigQuery Tables:**\n\n\n**Grounded Manual References:**\n\n\n# Examples\n\n```sql\nSELECT * FROM `hp-dragonfly.prj_ontology_hp_dragonfly.lex_service_manual_documents` LIMIT 10;\n```\n\n[^bq-source]: BigQuery Table `hp-dragonfly.prj_ontology_hp_dragonfly.lex_service_manual_documents`\n[^hp-msg-n17344]: HP Dragonfly Folio 13.5 inch G3 Maintenance and Service Guide (Doc Part N17344-001)", "tables/lex_service_playbooks": "# Overview\n\n`hp-dragonfly.prj_ontology_hp_dragonfly.lex_service_playbooks` (6 rows) \u2014 Unstructured LEX Node Table: 6 OKF v0.2 agent playbooks, computations, and metrics with Dataplex kc_entry_id.[^bq-source]\n\n[^hp-msg-n17344]\n\n- **BigQuery Property Graph Role:** Structured Table\n- **Grounded Service Manual Section:** HP Service Guide N17344-001[^hp-msg-n17344]\n\n# Schema\n\n| Column | Type | Mode | Description |\n| :--- | :--- | :--- | :--- |\n| `playbook_id` | `STRING` | `REQUIRED` | Canonical OKF playbook, computation, or metric ID |\n| `okf_type` | `STRING` | `REQUIRED` | OKF v0.2 type (Playbook, Computation, Metric) |\n| `title` | `STRING` | `REQUIRED` | English title of the OKF playbook or computation |\n| `target_issue_domain` | `STRING` | `REQUIRED` | Target troubleshooting domain (No-Boot/BIOS/Memory vs. Thermal/Battery/I-O) |\n| `pdf_page_ref` | `INTEGER` | `REQUIRED` | Primary page reference in HP Service Guide N17344-001 |\n| `okf_rel_path` | `STRING` | `REQUIRED` | Relative path inside bundles/hp_dragonfly/ |\n| `kc_entry_id` | `STRING` | `REQUIRED` | Dataplex Knowledge Catalog Entry FQN in okf_hp_dragonfly |\n| `agent_directive` | `STRING` | `REQUIRED` | Mandatory execution rule enforced on the Ontology Agent |\n\n# Cross-Concept Links\n\n**Related BigQuery Tables:**\n\n\n**Grounded Manual References:**\n\n\n# Examples\n\n```sql\nSELECT * FROM `hp-dragonfly.prj_ontology_hp_dragonfly.lex_service_playbooks` LIMIT 10;\n```\n\n[^bq-source]: BigQuery Table `hp-dragonfly.prj_ontology_hp_dragonfly.lex_service_playbooks`\n[^hp-msg-n17344]: HP Dragonfly Folio 13.5 inch G3 Maintenance and Service Guide (Doc Part N17344-001)", "tables/ports_sensors_and_docks": "# Overview\n\n`hp-dragonfly.prj_ontology_hp_dragonfly.ports_sensors_and_docks` (10 rows) \u2014 External I/O ports, internal sensors, status LEDs, active pen, and official HP docking station compatibility matrix[^bq-source]\n\nDocuments physical placement (`LEFT_SIDE`, `RIGHT_SIDE`, `TOP_BEZEL`, `INTERNAL_BOARD`, `EXTERNAL_DOCK`), electrical protocols (40 Gbps Thunderbolt 4 / USB4, DisplayPort 1.4, USB Power Delivery), automatic 3.5mm audio jack speaker cutoff logic (Manual p. 6), Time-of-Flight human presence sensor, and official HP Thunderbolt 120W/280W G4 Dock spare part numbers (`M97105-001`, `M97106-001`).[^hp-msg-n17344]\n\n- **BigQuery Property Graph Role:** Attribute & Compatibility Reference Table\n- **Grounded Service Manual Section:** Chapter 1: External Ports & Docks (p. 3), Chapter 2: Left/Right Side & Display Components (pp. 5\u20139)[^hp-msg-n17344]\n\n# Schema\n\n| Column | Type | Mode | Description |\n| :--- | :--- | :--- | :--- |\n| `feature_id` | `STRING` | `REQUIRED` | Unique port, sensor, or dock identifier (Primary Key) |\n| `model_id` | `STRING` | `REQUIRED` | Target model ID (FK -> dragonfly_series_models.model_id) |\n| `feature_category` | `STRING` | `REQUIRED` | Feature classification (External Port, Internal Sensor, Status LED, Docking Station, Active Pen) |\n| `feature_name` | `STRING` | `REQUIRED` | Port, sensor, or peripheral name |\n| `location_on_chassis` | `STRING` | `REQUIRED` | Physical location (Left Side, Right Side, Top Display Bezel, System Board, External USB-C) |\n| `protocol_or_spec` | `STRING` | `REQUIRED` | Supported electrical/data protocols and specifications (Thunderbolt 4 40Gbps, DP 1.4, USB-PD 65W/100W) |\n| `spare_part_number` | `STRING` | `NULLABLE` | Associated replacement or accessory spare part number |\n| `operational_behavior` | `STRING` | `REQUIRED` | Operational behavior and mode-specific constraints (e.g., keyboard auto-disable in tablet mode) |\n\n# Cross-Concept Links\n\n**Related BigQuery Tables:**\n- [`tables/dragonfly_series_models`](dragonfly_series_models.md)\n- [`tables/firmware_bios_and_nvm`](firmware_bios_and_nvm.md)\n- [`tables/community_troubleshooting_cases`](community_troubleshooting_cases.md)\n\n**Grounded Manual References:**\n- [`references/thunderbolt-4-port-and-dock-architecture`](../references/thunderbolt-4-port-and-dock-architecture.md)\n\n# Examples\n\n```sql\nSELECT\n  interface_id,\n  model_id,\n  interface_category,\n  interface_name,\n  physical_location,\n  max_data_rate_gbps,\n  compatible_dock_part_no\nFROM `hp-dragonfly.prj_ontology_hp_dragonfly.ports_sensors_and_docks`\nORDER BY interface_id;\n```\n\n[^bq-source]: BigQuery Table `hp-dragonfly.prj_ontology_hp_dragonfly.ports_sensors_and_docks`\n[^hp-msg-n17344]: HP Dragonfly Folio 13.5 inch G3 Maintenance and Service Guide (Doc Part N17344-001)", "tables/product_skus_and_configs": "# Overview\n\n`hp-dragonfly.prj_ontology_hp_dragonfly.product_skus_and_configs` (12 rows) \u2014 Commercial SKU configurations and hardware specifications for HP Elite Dragonfly G3, Dragonfly Folio G3, and series models (Node Table: ProductSKU)[^bq-source]\n\nBecause LPDDR5-6400 Dual-Channel memory (16 GB or 32 GB) and the 12th Gen Intel Core Alder Lake-U processor (i5-1235U, i5-1245U vPro, i7-1255U, i7-1265U vPro) are permanently soldered onto the motherboard, every commercial SKU (`sku_id`) maps deterministically to a specific System Board spare part number (`system_board_part_no`) in [hardware_components_catalog](hardware_components_catalog.md).[^hp-msg-n17344]\n\n- **BigQuery Property Graph Role:** Node Table (`ProductSKU`, Key: `sku_id`) & Edge Tables (`BELONGS_TO_MODEL`, `USES_SYSTEM_BOARD`)\n- **Grounded Service Manual Section:** Chapter 1: Product Description (pp. 1\u20134), Chapter 5: System Board Spare Part Matrix (pp. 63\u201365)[^hp-msg-n17344]\n\n# Schema\n\n| Column | Type | Mode | Description |\n| :--- | :--- | :--- | :--- |\n| `sku_id` | `STRING` | `REQUIRED` | Official HP product number / SKU ID (Primary Key, e.g., 6J175UTR#ABA) |\n| `model_id` | `STRING` | `REQUIRED` | Parent model identifier (FK -> dragonfly_series_models.model_id) |\n| `region_code` | `STRING` | `REQUIRED` | Target market region code (US, KR, EU, APAC, GLOBAL) |\n| `cpu_model` | `STRING` | `REQUIRED` | Installed processor model (e.g., Intel Core i7-1265U) |\n| `vpro_supported` | `BOOLEAN` | `REQUIRED` | Whether Intel vPro Enterprise management is supported |\n| `cpu_cores` | `INTEGER` | `REQUIRED` | Total CPU core count (Performance + Efficient cores) |\n| `cpu_max_turbo_ghz` | `FLOAT` | `REQUIRED` | Maximum Intel Turbo Boost clock frequency in GHz |\n| `ram_gb` | `INTEGER` | `REQUIRED` | Onboard soldered memory capacity in GB |\n| `ram_spec` | `STRING` | `REQUIRED` | Detailed memory specification (e.g., 16 GB LPDDR5-6400 Dual-Channel Soldered) |\n| `ssd_capacity_gb` | `INTEGER` | `REQUIRED` | Installed primary NVMe SSD capacity in GB |\n| `ssd_spec` | `STRING` | `REQUIRED` | SSD interface and encryption specification (e.g., M.2 2280 PCIe Gen4x4 NVMe TLC SED OPAL2) |\n| `display_resolution` | `STRING` | `REQUIRED` | Display resolution (e.g., WUXGA+ 1920x1280, 3K2K 3000x2000) |\n| `display_panel_type` | `STRING` | `REQUIRED` | Display panel technology and surface treatment (IPS Anti-Glare, IPS BrightView Touch, OLED BrightView) |\n| `brightness_nits` | `INTEGER` | `REQUIRED` | Peak display luminance in nits |\n| `sure_view_privacy` | `BOOLEAN` | `REQUIRED` | Whether HP Sure View Reflect integrated privacy screen is equipped |\n| `wwan_module` | `STRING` | `REQUIRED` | Installed cellular WWAN modem specification (None, Intel XMM 7560 R+ LTE, Intel 5000 5G) |\n| `wlan_module` | `STRING` | `REQUIRED` | Onboard wireless LAN and Bluetooth specification (e.g., Intel AX211 Wi-Fi 6E + BT 5.2) |\n| `battery_whr` | `INTEGER` | `REQUIRED` | Installed battery capacity in Whr |\n| `os_preinstalled` | `STRING` | `REQUIRED` | Factory preinstalled operating system |\n| `system_board_part_no` | `STRING` | `REQUIRED` | Mapped system board spare part number (FK -> hardware_components_catalog.part_number) |\n| `msrp_usd` | `INTEGER` | `REQUIRED` | Estimated launch MSRP in USD |\n\n# Cross-Concept Links\n\n**Related BigQuery Tables:**\n- [`tables/dragonfly_series_models`](dragonfly_series_models.md)\n- [`tables/hardware_components_catalog`](hardware_components_catalog.md)\n- [`tables/community_troubleshooting_cases`](community_troubleshooting_cases.md)\n\n**Grounded Manual References:**\n- [`references/hp-folio-g3-service-manual-n17344`](../references/hp-folio-g3-service-manual-n17344.md)\n- [`references/bios-nvm-and-hp-sure-start-security`](../references/bios-nvm-and-hp-sure-start-security.md)\n\n# Examples\n\n```sql\nSELECT\n  s.sku_id,\n  s.region_code,\n  s.cpu_model,\n  s.ram_gb,\n  s.display_panel_type,\n  s.wwan_module,\n  s.system_board_part_no,\n  c.component_name AS mapped_system_board\nFROM `hp-dragonfly.prj_ontology_hp_dragonfly.product_skus_and_configs` AS s\nJOIN `hp-dragonfly.prj_ontology_hp_dragonfly.hardware_components_catalog` AS c\n  ON s.system_board_part_no = c.part_number\nORDER BY s.model_id, s.sku_id;\n```\n\n[^bq-source]: BigQuery Table `hp-dragonfly.prj_ontology_hp_dragonfly.product_skus_and_configs`\n[^hp-msg-n17344]: HP Dragonfly Folio 13.5 inch G3 Maintenance and Service Guide (Doc Part N17344-001)"}, "types": ["Attested Computation", "BigQuery Dataset", "BigQuery Table", "Log", "Metric", "Playbook", "Reference"], "palette": {"BigQuery Dataset": "#8b5cf6", "BigQuery Table": "#3b82f6", "Reference": "#10b981"}};
